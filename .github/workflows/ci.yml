name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  test:
    runs-on: ubuntu-latest
    # The race detector needs cgo at test time; the module itself stays
    # CGO-free, which the cross-build job proves with CGO_ENABLED=0.
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
      - name: Gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needs to be run on:"
            echo "$out"
            exit 1
          fi
      - name: Vet
        run: CGO_ENABLED=0 go vet ./...
      - name: Test with coverage (race)
        run: |
          go test -race -covermode=atomic -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tail -1
      - name: Test the exports without embedded theme fonts (slides_fontsext)
        run: |
          go vet -tags slides_fontsext ./export
          go test -tags slides_fontsext ./export
      - name: Smoke test the command
        run: |
          go build -o slides ./cmd/slides
          ./slides -o /tmp/deck.html testdata/oracle/directives.md
          grep -q 'data-marpit-pagination' /tmp/deck.html
          ./slides expand testdata/oracle/kinds.src.md | diff - testdata/oracle/kinds-expanded.md

  cross-build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux/amd64
          - linux/arm64
          - linux/riscv64
          - linux/ppc64le
          - linux/s390x
          - linux/loong64
          - linux/386
          - linux/arm
          - darwin/amd64
          - darwin/arm64
          - windows/amd64
          - windows/arm64
          - freebsd/amd64
          - js/wasm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
      - name: Build
        run: |
          GOOS=${TARGET%/*} GOARCH=${TARGET#*/} go build ./...
        env:
          TARGET: ${{ matrix.target }}
